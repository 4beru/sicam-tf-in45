# Compila el .exe de Windows de SICAM con PyInstaller.
#
# Se dispara manualmente desde la pestaña Actions (workflow_dispatch) o al
# publicar un tag `v*` (p. ej. v1.0.0).
name: build-exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  # ---------------------------------------------------------------- tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8"

      # PySide6 necesita librerías de sistema (EGL/GL/xkb/xcb) para importar
      # aunque se use la plataforma offscreen. En ubuntu-latest no vienen
      # instaladas por defecto, por lo que sin este paso pytest falla con
      # "ImportError: libEGL.so.1: cannot open shared object file".
      - name: Instalar librerías de sistema para Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-glx0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libdbus-1-3 \
            libfontconfig1 \
            libglib2.0-0

      # uv incluye el grupo `dev` por defecto (pytest + pyinstaller).
      - name: Instalar dependencias (con dev)
        run: uv sync

      - name: Ejecutar tests (sin display)
        run: QT_QPA_PLATFORM=offscreen uv run pytest -q

  # ------------------------------------------------------------- build exe
  build:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8"

      - name: Instalar dependencias (con dev)
        run: uv sync

      # --windowed evita la consola; --onefile empaqueta todo en un solo exe.
      - name: Compilar SICAM.exe con PyInstaller
        run: uv run pyinstaller --noconfirm --clean --onefile --windowed --name SICAM app/main.py

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SICAM-windows
          path: dist/SICAM.exe

  # -------------------------------------------------------------- release
  # Crea (o actualiza) un GitHub Release y adjunta SICAM.exe. Solo corre
  # cuando el flujo se dispara por un tag `v*`, que es lo que usamos como
  # versión pública. El dispatch manual sigue dejando el artefacto en Actions.
  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # necesario para crear el release y subir el archivo
    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: SICAM-windows
          path: dist

      - name: Crear release y adjuntar SICAM.exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/SICAM.exe
          generate_release_notes: true
